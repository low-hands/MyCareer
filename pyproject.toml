[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent"
version = "0.1.0"
description = "Local Career Agent domain foundation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "openai>=1.66",
    "pypdf>=6.0",
    "deepagents>=0.7.6,<0.8",
    "langchain-openai>=1.1,<2",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "keyring>=25,<26",
    "uvicorn>=0.34,<1",
]

[project.scripts]
career-agent = "career_agent.cli:main"
career-agent-api = "career_agent.api.app:run"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
