[project]
name = "career-agent"
version = "0.1.0"
description = "A small, extensible agent harness for a career assistant product"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3,<1.4",
    "langchain-openai>=1.2,<1.3",
    "langgraph>=1.2,<1.3",
    "pydantic>=2.12,<3",
    "langchain-mcp-adapters>=0.1,<0.2",
    "python-dotenv>=1.2.2",
    "boss-agent-cli[mcp]>=1.17.0",
    "pymupdf>=1.28.0",
]

[project.optional-dependencies]
deepagents = ["deepagents>=0.4,<0.5"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<0.15",
]

[project.scripts]
career-agent = "career_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
