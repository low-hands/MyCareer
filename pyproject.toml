[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent"
version = "0.1.0"
description = "Local Career Agent domain foundation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "python-dotenv>=1.0", "langgraph>=0.2", "openai>=1.0", "pypdf>=6.0"]

[project.scripts]
career-agent = "career_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
